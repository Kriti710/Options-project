[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-volatility-explorer"
version = "0.1.0"
description = "An explorer for NIFTY option implied volatility."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "streamlit==1.63.0",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
nifty-vol-collect = "nifty_vol.collector.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
